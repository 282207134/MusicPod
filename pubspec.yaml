name: musicpod
description: MusicPod music and podcasts from the Pixso reference.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  xml: ^7.1.0
  url_launcher: ^6.3.3
dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
